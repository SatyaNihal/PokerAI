[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poker-ai-research"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<2", "torch==2.4.1", "fastapi", "uvicorn", "pydantic>=2", "PyYAML", "tensorboard", "psutil"]

[project.optional-dependencies]
dev = ["open_spiel==2.0.2", "pytest", "httpx", "ruff"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["slow: production research runs", "validation: requires development-only OpenSpiel"]

[tool.ruff]
line-length = 110

